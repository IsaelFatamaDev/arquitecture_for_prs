<tspan x="1050.0" dy="0">IncidentClient</tspan>
<tspan x="1050.0" dy="19">Dominio ↔ DTO remoto mapper</tspan>
<tspan x="1050.0" dy="19">HTTP client · timeout · errores</tspan>
</text>
<text x="1050.0" y="727" text-anchor="middle" fill="#14b8a6" font-family="Consolas, Courier New, monospace" font-size="10" font-weight="600">adapter/out/client</text>
