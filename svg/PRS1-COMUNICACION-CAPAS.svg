<path d="M1200 660 H1260 V782 H1340" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" class="flow"/>
