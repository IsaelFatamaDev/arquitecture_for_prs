<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc">
<title id="title">PRS1 · Cañete Seguro: arquitectura hexagonal y comunicación</title>
<desc id="desc">Diagrama homogéneo de arquitectura hexagonal para el contexto alert. Gateway independiente, adaptador REST de entrada, caso de uso, dominio y puertos de salida hacia persistencia y cliente HTTP externo. Incluye mappers de cada frontera, seguridad y manejo centralizado de excepciones.</desc>
<defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#101b2c"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8ca1bb"/></marker><style>.flow{animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></defs>
<rect width="1600" height="1000" rx="24" fill="url(#background)"/><rect x="1" y="1" width="1598" height="998" rx="24" fill="none" stroke="#27364b" stroke-width="2"/>

