<path d="M620 430 V442" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
<path d="M693 442 V430" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
<rect x="35" y="465" width="420" height="205" rx="16" fill="#111b2b" stroke="#33445a" stroke-width="1"/>
<text x="58" y="496" text-anchor="start" fill="#dbe5f1" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700">RESPUESTA Y ERRORES</text>
<text x="58" y="528" text-anchor="start" fill="#a9b8cb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">
<tspan x="58" dy="0">Respuesta: caso de uso → mapper REST → gateway → cliente.</tspan>
<tspan x="58" dy="25">Excepciones propias: infrastructure/exception/custom/.</tspan>
<tspan x="58" dy="25">GlobalExceptionHandler produce una respuesta HTTP segura.</tspan>
<tspan x="58" dy="25">Handlers especiales solo si hacen falta.</tspan>
<tspan x="58" dy="25">Nunca expongas stack traces ni detalles internos.</tspan>
</text>
<rect x="35" y="700" width="420" height="110" rx="16" fill="#101c2b" stroke="#54657a" stroke-width="1"/>
<text x="58" y="732" text-anchor="start" fill="#dbe5f1" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700">LÍMITES</text>
<text x="58" y="758" text-anchor="start" fill="#a9b8cb" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400">
<tspan x="58" dy="0">Sin TenantContext por defecto. PRS4: aislamiento organizacional solo</tspan>
<tspan x="58" dy="23">si aplica y validado por el servicio dueño de los datos.</tspan>
</text>
<rect x="35" y="845" width="1525" height="105" rx="14" fill="#101827" stroke="#26364b" stroke-width="1"/>
<text x="58" y="875" text-anchor="start" fill="#fb923c" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700">MAPEO POR FRONTERA</text>
<text x="58" y="905" text-anchor="start" fill="#c5d2e2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">HTTP request/response ↔ aplicación: REST mapper</text>
<text x="490" y="905" text-anchor="start" fill="#c5d2e2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">Dominio ↔ Mongo Document: persistence mapper</text>
<text x="1050" y="905" text-anchor="start" fill="#c5d2e2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">Dominio ↔ contrato remoto: client mapper</text>
<text x="58" y="932" text-anchor="start" fill="#90a2b8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">Regla de dependencias: adaptadores → puertos / casos de uso → dominio. El dominio no depende de Spring, HTTP ni tecnología de persistencia.</text>
</svg>
