<text x="255" y="55" text-anchor="start" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Arquitectura hexagonal · flujo de una petición</text>
<text x="40" y="91" text-anchor="start" fill="#a9b8cb" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Un caso de uso del contexto alert · gateway separado · adaptadores en los bordes · dependencias hacia el dominio</text>
