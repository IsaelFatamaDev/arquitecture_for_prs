<text x="1450.0" y="606" text-anchor="middle" fill="#b7c5d8" font-family="Consolas, Courier New, monospace" font-size="11" font-weight="400">
<tspan x="1450.0" dy="0">MongoDB</tspan>
<tspan x="1450.0" dy="19">modelo técnico separado</tspan>
<tspan x="1450.0" dy="19">del modelo de dominio</tspan>
</text>
